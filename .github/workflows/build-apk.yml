
name: Crear APK de Dragon Isles

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto Android
        id: project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No se encontró el ZIP del proyecto en la raíz."
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          SETTINGS="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "No se encontró settings.gradle dentro del ZIP."
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Compilar APK
        run: gradle -p "${{ steps.project.outputs.project_dir }}" assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Isles-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
